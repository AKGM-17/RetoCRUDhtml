<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="../css/view.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ModifyView</title>
</head>

<body>
    <header id="header">
        <!-- Navbar se cargará dinámicamente -->
    </header>
    <main>
        <div id="modify">
            <h2>User Data</h2>
            <form action="#" method="post">
                <div class="form-flex">
                    <div class="avatar" aria-hidden="true"></div>
                    <div class="fields">
                        <div class="field">
                            <label for="username">Username:</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="field">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="field">
                            <label for="surname">Surname:</label>
                            <input type="text" id="surname" name="surname" required>
                        </div>
                        <div class="field">
                            <label for="gmail">Gmail:</label>
                            <input type="email" id="gmail" name="gmail" required>
                        </div>
                        <div class="field">
                            <label for="telephone">Telephone:</label>
                            <input type="tel" id="telephone" name="telephone">
                        </div>
                        <div class="field">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="field">
                            <label for="card_no">Card Number:</label>
                            <input type="text" id="card_no" name="card_no" required>
                        </div>
                        <div class="field">
                            <label for="gender">Gender:</label>
                            <input type="text" id="gender" name="gender" required>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn">Modify</button>
                    <button type="button" class="btn btn-secondary">Delete</button>
                </div>
            </form>
        </div>
    </main>
    <footer id="footer">
        <!-- Footer se cargará dinámicamente -->
    </footer>

    <script src="../JavaScript/ComponentLoader.js"></script>
    <script src="../JavaScript/GetCurrentUser.js" defer></script>
    <script src="../JavaScript/ModifyUser.js" defer></script>
    <script src="../JavaScript/DeleteUser.js" defer></script>
</body>

</html>
