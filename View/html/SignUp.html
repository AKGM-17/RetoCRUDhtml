<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="../css/view.css">
    <title>Registro - CRUD Users</title>
</head>
<body>
    <header id="header">
        <!-- Navbar se cargará dinámicamente -->
    </header>
    <main>
        <div id="modify">
            <h2>Crear Nueva Cuenta</h2>
            <form action="#" method="post" id="signupForm">
                <div class="form-flex">
                    <div class="avatar" aria-hidden="true"></div>
                    <div class="fields">
                        <div class="field">
                            <label for="username">Username:</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="field">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="field">
                            <label for="surname">Surname:</label>
                            <input type="text" id="surname" name="surname" required>
                        </div>
                        <div class="field">
                            <label for="gmail">Email:</label>
                            <input type="email" id="gmail" name="gmail" required>
                        </div>
                        <div class="field">
                            <label for="telephone">Telephone:</label>
                            <input type="tel" id="telephone" name="telephone">
                        </div>
                        <div class="field">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">Confirm Password:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <div class="field">
                            <label for="card_no">Card Number:</label>
                            <input type="text" id="card_no" name="card_no" required>
                        </div>
                        <div class="field">
                            <label for="gender">Gender:</label>
                            <select id="gender" name="gender" required>
                                <option value="">Select...</option>
                                <option value="Masculino">Male</option>
                                <option value="Femenino">Female</option>
                                <option value="Otro">Other</option>
                                <option value="Prefiero no decir">Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn">Sign Up</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='LogIn.html'">Already have an account? Login</button>
                </div>
            </form>
        </div>
    </main>
    <footer id="footer">
        <!-- Footer se cargará dinámicamente -->
    </footer>

    <script src="../JavaScript/ComponentLoader.js"></script>
    <script src="../JavaScript/SignUp.js"></script>
</body>
</html>
